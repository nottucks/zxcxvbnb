<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>blog - {{ config.title }}</title>
    <link rel="stylesheet" href="{{ get_url(path='style.css') | safe }}">
</head>

<body>
    {% include "header.html" %}

    <main>
        <h3>sorted latest to oldest:</h3>
        <ul class="posts">
            {% for page in section.pages %}
            <li>
                <a href="{{ page.permalink }}">{{ page.title }}.md</a>
                <span class="date">{{ page.date | date(format="%m-%d-%Y") }}</span>
            </li>
            {% endfor %}
        </ul>
    </main>
</body>

</html>
