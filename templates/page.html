<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) | safe }}">
</head>

<body>
    {% include "header.html" %}

    <main>
        {% if page.date %}
        <h1 class="article-title">{{ page.title }}</h1>
        {% endif %}
        {{ page.content | safe }}
    </main>
</body>

</html>
