name: Deploy to server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Zola
        run: |
          ZOLA_VERSION="0.19.2"
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv zola /usr/local/bin/

      - name: Build Site
        run: zola --config zola.toml build

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Deploy to VPS
        env:
          VPS_IP: ${{ secrets.VPS_TAILSCALE_IP }}
        run: |
          tar -czf - -C public . | tailscale ssh root@$VPS_IP "mkdir -p /var/www/ixxz.moe && tar -xzf - -C /var/www/ixxz.moe && chown -R caddy:caddy /var/www/ixxz.moe"
